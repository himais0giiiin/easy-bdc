name = "edbb"
main = "index.ts"
compatibility_date = "2025-11-22"

[vars]
DEBUG = true

[build]
command = "npm run build"

[assets]
directory = "dist"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "SHORT_KV"
id = "9a0530f63a9a4e6780f595b56d819b23"

# /share/create の連投対策: 同一IPから 60 秒あたり 20 回まで
# (index.ts はこの束縛が無くても動くので、不要なら削除してよい)
[[ratelimits]]
name = "SHARE_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60
